user nginx;
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  access_log /dev/stdout combined;
  client_max_body_size 13m;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/cloudflare-ranges.conf;
  map $remote_addr $cwt_trusted_client_address {
    default "";
    127.0.0.1 $http_x_cwt_lab_client_address;
  }
  server {
    listen 8080;
    server_name cwtextile.com;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-CWT-Client-Address $cwt_trusted_client_address;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header True-Client-IP "";
      proxy_pass http://web-production:3000;
    }
  }
  server {
    listen 8081;
    server_name staging.cwtextile.com;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-CWT-Client-Address $cwt_trusted_client_address;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header True-Client-IP "";
      proxy_pass http://web-staging:3000;
    }
  }
}
