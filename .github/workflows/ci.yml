name: CWT quality gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  CWT_RELEASE_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_TELEMETRY_DISABLED: "1"
  APP_ENV: test
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  NON_PRODUCTION_NOINDEX: "true"
  DATABASE_DRIVER: pglite
  PGLITE_DATA_DIR: /tmp/cwt-ci/pglite
  STORAGE_DRIVER: local
  PUBLIC_STORAGE_ROOT: /tmp/cwt-ci/storage/public
  PRIVATE_STORAGE_ROOT: /tmp/cwt-ci/storage/private
  IMPORT_STORAGE_ROOT: /tmp/cwt-ci/storage/import
  FILE_SCAN_DRIVER: development
  EMAIL_DRIVER: log
  ANALYTICS_DRIVER: disabled
  MONITORING_DRIVER: log
  FEATURE_AI: "false"
  FEATURE_SEO_ASSISTANT: "false"

jobs:
  quality-postgres:
    name: Quality + PostgreSQL + AI proof
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CWT_PHASE_C_POSTGRES_URL: postgres://cwt_ci@127.0.0.1:55432/cwt_ci
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime identity
        run: pnpm env:check

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify AI prompt authority
        run: pnpm check:ai-prompts

      - name: Verify AI Prompt append-only history
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PROMPT_HISTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROMPT_HISTORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --import=tsx scripts/verify-ai-prompt-history.ts \
            --base="$PROMPT_HISTORY_BASE_SHA" \
            --candidate="$PROMPT_HISTORY_CANDIDATE_SHA"

      - name: Report AI Prompt history not applicable for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: echo "AI Prompt history comparison is not applicable to workflow_dispatch without an event base commit."

      - name: Verify Phase D synthetic boundary
        run: pnpm check:ai-phase-d-synthetic

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build exact PostgreSQL 18.4 from official source
        shell: bash
        run: |
          set -euo pipefail
          pg_root="${RUNNER_TEMP:?}/cwt-postgresql-18.4-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-${GITHUB_JOB:?}"
          pg_archive="$pg_root/source/postgresql-18.4.tar.bz2"
          pg_source="$pg_root/source/postgresql-18.4"
          pg_build="$pg_root/build"
          pg_install="$pg_root/install"
          mkdir -p "$pg_root/source" "$pg_build" "$pg_install" "$pg_root/data" "$pg_root/log"

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 2 --retry-connrefused --retry-max-time 240 \
            --output "$pg_archive" \
            https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2
          printf '%s  %s\n' \
            '81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094' \
            "$pg_archive" | shasum -a 256 --check
          tar -xjf "$pg_archive" -C "$pg_root/source"

          cd "$pg_build"
          "$pg_source/configure" \
            --prefix="$pg_install" \
            --without-readline \
            --without-zlib \
            --without-icu \
            --cache-file="$pg_build/config.cache"
          make -C "$pg_build" -j"$(sysctl -n hw.ncpu)"
          make -C "$pg_build" install
          test "$("$pg_install/bin/postgres" --version)" = 'postgres (PostgreSQL) 18.4'

      - name: Start isolated PostgreSQL 18.4
        shell: bash
        run: |
          set -euo pipefail
          pg_root="${RUNNER_TEMP:?}/cwt-postgresql-18.4-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-${GITHUB_JOB:?}"
          pg_install="$pg_root/install"
          pg_data="$pg_root/data"
          pg_log="$pg_root/log/postgresql.log"

          "$pg_install/bin/initdb" \
            --pgdata="$pg_data" \
            --encoding=UTF8 \
            --locale=C \
            --auth-local=trust \
            --auth-host=trust \
            --username=cwt_ci
          "$pg_install/bin/pg_ctl" \
            --pgdata="$pg_data" \
            --log="$pg_log" \
            --options='-h 127.0.0.1 -p 55432' \
            --wait --timeout=60 start
          "$pg_install/bin/createdb" \
            --host=127.0.0.1 --port=55432 --username=cwt_ci cwt_ci
          test "$("$pg_install/bin/psql" \
            --host=127.0.0.1 --port=55432 --username=cwt_ci --dbname=cwt_ci \
            --tuples-only --no-align --command='SHOW server_version')" = '18.4'
          test "$("$pg_install/bin/psql" \
            --host=127.0.0.1 --port=55432 --username=cwt_ci --dbname=cwt_ci \
            --tuples-only --no-align --command='SHOW server_encoding')" = 'UTF8'
          test "$("$pg_install/bin/psql" \
            --host=127.0.0.1 --port=55432 --username=cwt_ci --dbname=cwt_ci \
            --tuples-only --no-align --command='SELECT 1')" = '1'

      - name: Apply fresh PostgreSQL migrations through 0021
        env:
          APP_ENV: test
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgres://cwt_ci@127.0.0.1:55432/cwt_ci
        run: |
          test -f drizzle/0020_phase1b_ai_foundation.sql
          test -f drizzle/0021_phase_f_k1_run_cost_ceiling.sql
          pnpm db:migrate

      - name: Run the full test suite with PostgreSQL suites enabled
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm test:run

      - name: Report bounded PostgreSQL failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          pg_root="${RUNNER_TEMP:?}/cwt-postgresql-18.4-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-${GITHUB_JOB:?}"
          pg_log="$pg_root/log/postgresql.log"
          if [ -f "$pg_log" ]; then
            echo 'Last PostgreSQL log bytes (synthetic CI cluster only):'
            tail -c 32768 "$pg_log" | tail -n 200
          else
            echo 'No PostgreSQL server log was created before the failure.'
          fi

      - name: Stop and remove task-owned PostgreSQL
        if: always()
        shell: bash
        run: |
          set +e
          pg_root="${RUNNER_TEMP:?}/cwt-postgresql-18.4-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}-${GITHUB_JOB:?}"
          pg_install="$pg_root/install"
          pg_data="$pg_root/data"
          cleanup_status=0
          owned_pid=''

          case "$pg_root" in
            "${RUNNER_TEMP}/cwt-postgresql-18.4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}") ;;
            *) echo 'Refusing cleanup outside the exact task-owned PostgreSQL root.' >&2; exit 1 ;;
          esac

          if [ -f "$pg_data/postmaster.pid" ]; then
            owned_pid="$(sed -n '1p' "$pg_data/postmaster.pid")"
          fi
          if [ -x "$pg_install/bin/pg_ctl" ] && [ -f "$pg_data/postmaster.pid" ]; then
            "$pg_install/bin/pg_ctl" \
              --pgdata="$pg_data" --mode=fast --wait --timeout=60 stop || cleanup_status=1
          fi

          if [[ "$owned_pid" =~ ^[0-9]+$ ]] && kill -0 "$owned_pid" 2>/dev/null; then
            owned_command="$(ps -ww -p "$owned_pid" -o command= 2>/dev/null)"
            case "$owned_command" in
              "$pg_install/bin/postgres -D $pg_data"*)
                echo 'pg_ctl did not stop the task-owned server; terminating only its verified postmaster.' >&2
                cleanup_status=1
                kill -TERM "$owned_pid" 2>/dev/null
                for _ in {1..20}; do
                  kill -0 "$owned_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$owned_pid" 2>/dev/null; then
                  kill -KILL "$owned_pid" 2>/dev/null
                  for _ in {1..10}; do
                    kill -0 "$owned_pid" 2>/dev/null || break
                    sleep 1
                  done
                fi
                ;;
              *)
                echo 'Refusing to signal a live process that is not the task-owned PostgreSQL postmaster.' >&2
                cleanup_status=1
                ;;
            esac
          fi

          if [[ "$owned_pid" =~ ^[0-9]+$ ]] && kill -0 "$owned_pid" 2>/dev/null; then
            echo 'Task-owned PostgreSQL postmaster remains live; preserving its root for runner teardown.' >&2
            cleanup_status=1
          else
            rm -rf -- "$pg_root" || cleanup_status=1
            [ ! -e "$pg_root" ] || cleanup_status=1
          fi
          exit "$cleanup_status"

  build-bundle:
    name: Build + public bundle
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime identity
        run: pnpm env:check

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate a clean disposable Build database
        run: pnpm db:migrate

      - name: Build and verify the public bundle boundary
        run: pnpm check:bundle

  browser:
    name: Browser
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime identity
        run: pnpm env:check

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser acceptance without retries
        run: pnpm exec playwright test --retries=0

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out dependency history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve audit scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            echo "dependency_change=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
            echo "dependency_change=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
            echo "dependency_change=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- package.json pnpm-lock.yaml; then
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
            echo "dependency_change=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
            echo "dependency_change=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report non-applicable PR gate
        if: steps.scope.outputs.dependency_change != 'true' && steps.scope.outputs.full_audit != 'true'
        run: echo "No package.json or pnpm-lock.yaml change; the dependency-changing PR gate is not applicable."

      - name: Install pnpm
        if: steps.scope.outputs.dependency_change == 'true' || steps.scope.outputs.full_audit == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        if: steps.scope.outputs.dependency_change == 'true' || steps.scope.outputs.full_audit == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify runtime identity
        if: steps.scope.outputs.dependency_change == 'true' || steps.scope.outputs.full_audit == 'true'
        run: pnpm env:check

      - name: Install exact dependencies
        if: steps.scope.outputs.dependency_change == 'true' || steps.scope.outputs.full_audit == 'true'
        run: pnpm install --frozen-lockfile

      - name: High and Critical dependency gate
        if: steps.scope.outputs.dependency_change == 'true'
        run: |
          echo "A registry or network failure is INDETERMINATE, never PASS; rerun after service recovery."
          pnpm audit --prod --audit-level=high

      - name: Scheduled full dependency audit
        if: steps.scope.outputs.full_audit == 'true'
        run: |
          echo "This scheduled run reports all severities and is not a PR merge gate."
          echo "A registry or network failure is INDETERMINATE, never PASS."
          pnpm audit --prod
